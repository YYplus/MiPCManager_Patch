name: Verify one-click installer
on:
  push:
    branches: [ci/one-click-install-check]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: one-click-install-release
          cache-on-failure: true
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo check lib
        run: cargo check --lib
      - name: cargo check CLI
        run: cargo check --bin MiPCM_CLI
      - name: cargo check GUI
        run: cargo check --bin MiPCM_GUI
      - name: cargo test
        run: cargo test -- --nocapture
      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
