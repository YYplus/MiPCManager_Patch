name: Package verified one-click installer
on:
  push:
    branches: [ci/one-click-install-check]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: one-click-install-release
          cache-on-failure: true
      - name: cargo release
        run: cargo build --release --bin MiPCM_GUI --bin MiPCM_CLI
      - name: Stage verified binaries
        shell: pwsh
        run: |
          $outDir = Join-Path $env:GITHUB_WORKSPACE 'verified-artifacts'
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages |
            Where-Object name -eq 'mipcmanager_patch' | Select-Object -ExpandProperty version
          foreach ($frontend in @('GUI', 'CLI')) {
            Copy-Item -LiteralPath "target/release/MiPCM_$frontend.exe" -Destination (Join-Path $outDir "MiPCM_Patch_$($frontend)_v$version.exe")
          }
      - uses: actions/upload-artifact@v6
        with:
          name: MiPCM-one-click-binaries
          path: verified-artifacts/*.exe
      - name: Package aria2 sources
        shell: pwsh
        run: |
          $outDir = Join-Path $env:GITHUB_WORKSPACE 'verified-artifacts'
          $sourceDir = Join-Path $env:RUNNER_TEMP 'aria2-sources'
          New-Item -ItemType Directory -Force -Path $sourceDir | Out-Null
          $sources = Get-Content -Raw -LiteralPath 'assets/aria2/sources.json' | ConvertFrom-Json
          foreach ($source in $sources) {
            $dest = Join-Path $sourceDir $source.name
            Write-Host "Downloading aria2 source: $($source.name)"
            curl.exe --ipv4 --fail --location --retry 3 --retry-all-errors `
              --connect-timeout 15 --max-time 60 --output $dest $source.url
            if ($LASTEXITCODE -ne 0) {
              throw "aria2 源码下载失败：$($source.name)"
            }
            if ((Get-FileHash -LiteralPath $dest -Algorithm SHA256).Hash -ne $source.sha256) {
              throw "aria2 源码 SHA-256 不匹配：$($source.name)"
            }
          }
          foreach ($notice in @('NOTICE.md', 'COPYING', 'LICENSE.OpenSSL', 'AUTHORS', 'README.mingw', 'sources.json')) {
            Copy-Item -LiteralPath (Join-Path 'assets/aria2' $notice) -Destination $sourceDir
          }
          Copy-Item -LiteralPath 'LICENSE' -Destination (Join-Path $sourceDir 'COPYING.GPLv3')
          Compress-Archive -Path (Join-Path $sourceDir '*') -DestinationPath (Join-Path $outDir 'aria2-1.37.0-sources.zip') -Force
          Get-ChildItem -LiteralPath $outDir | Select-Object Name, Length | Format-Table
      - uses: actions/upload-artifact@v6
        with:
          name: MiPCM-one-click-install
          path: verified-artifacts/
